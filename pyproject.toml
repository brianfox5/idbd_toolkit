[project]
name = "idbd-toolkit"
version = "0.1.0"
description = "Tools for implementing the Inquiry-Driven Big Data (IDBD) six-phase research process"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Brian Fox", email = "bfox@bentley.edu" }
]
requires-python = ">=3.13"
dependencies = []
keywords = ["research methods", "big data", "abduction", "bayesian updating", "management"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Web client — a thin HTTP + browser layer over the SAME core/tools (another
# client alongside the agent toolkit). Not imported by the core.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Agent assist ("Draft with agent"): bring-your-own-key LLM providers.
    "anthropic>=0.70",
    "openai>=1.60",        # OpenAI and any OpenAI-compatible endpoint (Ollama, OpenRouter, …)
    "google-genai>=1.20",  # Google Gemini
    "pypdf>=5.0",          # PDF text for models that cannot read PDFs natively
    "jsonschema>=4.20",    # check drafts against the step's schema
]
# Analysis layer for the worked example's data scripts (agent-side exploratory
# work; NOT used by the deterministic core). pandas reads .dta/.csv natively.
analysis = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=16",
    "statsmodels>=0.14",
]

[project.scripts]
idbd-web = "idbd_toolkit.web.server:main"
idbd-admin = "idbd_toolkit.web.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI's TestClient
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
