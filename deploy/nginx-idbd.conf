# nginx: serve the IDBD workspace at https://<your-site>/idbd/
# Paste these two blocks inside the existing `server { ... }` block for your site
# (the one with `listen 443 ssl`), then:  sudo nginx -t && sudo systemctl reload nginx

location = /idbd { return 301 /idbd/; }

location /idbd/ {
    # The trailing slash strips the /idbd/ prefix before forwarding; the app
    # knows its prefix from IDBD_ROOT_PATH.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # "Draft with agent" can take a minute or more (default is 60 s).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Reference uploads (PDFs) up to 100 MB (default is 1 MB).
    client_max_body_size 100m;
}
