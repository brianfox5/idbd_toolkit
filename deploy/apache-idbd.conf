# Apache: serve the IDBD workspace at https://<your-site>/idbd/
# Needs mod_proxy, mod_proxy_http and mod_headers:
#   Ubuntu/Debian:  sudo a2enmod proxy proxy_http headers
#   RHEL/Alma/Rocky/Amazon Linux: enabled by default; also allow the proxy
#   connection under SELinux:  sudo setsebool -P httpd_can_network_connect 1
# Paste just before </VirtualHost> in your site's HTTPS config
# (Ubuntu + Let's Encrypt: /etc/apache2/sites-enabled/<site>-le-ssl.conf), then:
#   sudo apachectl configtest && sudo systemctl reload apache2

RedirectMatch 301 ^/idbd$ /idbd/

<Location /idbd/>
    # Forward without the /idbd/ prefix; the app knows it from IDBD_ROOT_PATH.
    ProxyPass        http://127.0.0.1:8765/ timeout=300
    ProxyPassReverse http://127.0.0.1:8765/
    RequestHeader set X-Forwarded-Proto "https"
    # Reference uploads (PDFs) up to 100 MB.
    LimitRequestBody 104857600
</Location>

# "Draft with agent" can take a minute or more.
ProxyTimeout 300
